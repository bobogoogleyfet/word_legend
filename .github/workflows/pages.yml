name: Deploy to GitHub Pages

on:
  push:
    # This repo is on master; main is here so a rename doesn't silently stop deploys.
    branches: [main, master]
  workflow_dispatch:

# Lets the workflow publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Also flips the Pages source to "GitHub Actions" if the repo is still set to
      # publish from a branch, which would serve the repo root instead of dist/.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Rust with the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Version must match the wasm-bindgen crate in Cargo.lock.
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build the web bundle
        run: ./build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
