name: Deploy to GitHub Pages

# One Pages site serves both builds: main at the root, wip under /wip/ for testing
# changes before they reach main. Either branch's push rebuilds both, since each
# deploy replaces the whole site.
on:
  push:
    branches: [main, wip]
  workflow_dispatch:

# Lets the workflow publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/checkout@v4
        with:
          ref: wip
          path: wip

      # Also flips the Pages source to "GitHub Actions" if the repo is still set to
      # publish from a branch, which would serve the repo root instead of dist/.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Rust with the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            main
            wip

      - name: Install wasm-bindgen-cli
        # Version must match the wasm-bindgen crate in Cargo.lock.
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Test and build main
        working-directory: main
        run: |
          cargo test --locked
          ./build-web.sh

      - name: Test and build wip
        working-directory: wip
        # Its own save slot, so testing never touches the real game's save.
        env:
          WORD_LEGEND_STORAGE_PREFIX: word_legend_wip
        run: |
          cargo test --locked
          ./build-web.sh
          sed -i 's|<title>Word Legend</title>|<title>Word Legend (test)</title>|' dist/index.html

      - name: Put wip under /wip/
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          cp -r wip/dist site/wip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
