# Cloudflare Worker for Word Legend.
#
# NOTHING SECRET GOES IN THIS FILE. It is committed. The one secret the Worker
# needs is set out-of-band and stored by Cloudflare:
#
#   npx wrangler secret put SEED_SECRET
#
# The KV id below is not a credential -- it names a namespace and grants nothing
# on its own; only an authenticated account can reach it.

name = "word-legend"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Serve on <worker>.<subdomain>.workers.dev. On by default, but stated outright
# so a deploy cannot silently succeed while serving nothing.
workers_dev = true

# Fill in after: npx wrangler kv namespace create ROUNDS
[[kv_namespaces]]
binding = "ROUNDS"
id = "d7917b76bba84c66bc342f857722550a"

# One Durable Object per round holds that round's leaderboard. KV could not:
# simultaneous submissions overwrote each other, and cached reads hid new scores.
[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Leaderboard"]

# One Durable Object per player holds their banked scores, so a scored round does
# not cost a KV write (the free plan allows a thousand a day).
[[durable_objects.bindings]]
name = "PLAYER"
class_name = "Player"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Player"]

[vars]
# Public knobs only. Secrets never appear here.
ROUND_SECONDS = "180"
RESULTS_SECONDS = "30"
# Rounds cycle through the packs that have been uploaded.
PACK_COUNT = "10"
PACK_SIZE = "100"
# Only these origins may call the API.
ALLOWED_ORIGINS = "https://bobogoogleyfet.github.io,http://localhost:8080"
