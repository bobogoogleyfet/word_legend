<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Word Legend</title>
<meta name="description" content="A two-minute word game with a promotion and relegation ladder." />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #12141c;
    color: #e8ecf5;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* The board is dragged across, so the browser must not claim the gesture. */
    overscroll-behavior: none;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }
  #status h1 { margin: 0; font-size: 30px; letter-spacing: 0.12em; color: #5b8cff; }
  #status p { margin: 0; color: #8b93ab; max-width: 34ch; }
  #bar { width: 220px; height: 6px; border-radius: 3px; background: #2a2f42; overflow: hidden; }
  #bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 3px;
    background: #5b8cff;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .failed h1 { color: #ff5c5c; }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- The word lists are baked into the wasm, so the download is a couple of
       megabytes; say so rather than showing a blank screen. -->
  <div id="status">
    <h1>WORD LEGEND</h1>
    <p>Loading the dictionary…</p>
    <div id="bar"><span></span></div>
  </div>

  <script type="module">
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');

    function fail(message, err) {
      console.error(err);
      status.className = 'failed';
      status.innerHTML = '<h1>WORD LEGEND</h1><p>' + message + '</p>';
    }

    // Imported dynamically, not with a top-level `import`: a static one that 404s
    // takes the whole module down before any of this runs, leaving the loading bar
    // spinning forever with the reason only in the console.
    let wasm;
    try {
      wasm = await import('./word_legend_app.js');
    } catch (err) {
      fail(
        'The game bundle failed to load. If this is a GitHub Pages deploy, check ' +
        'that Pages is publishing the built <code>dist/</code> from the Actions ' +
        'workflow rather than the repository root.',
        err,
      );
      throw err;
    }

    try {
      await wasm.default();
      status.remove();
      await wasm.start(canvas);
    } catch (err) {
      fail(
        'This game needs a browser with WebAssembly and WebGL2. Check the console ' +
        'for details.',
        err,
      );
    }
  </script>
</body>
</html>
